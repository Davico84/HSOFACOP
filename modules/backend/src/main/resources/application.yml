# Configuración única de la aplicación (sin perfiles).
# TODOS los valores configurables se externalizan como secretos:
#  - en local se cargan de ./secrets.properties (ignorado por git)
#  - en despliegue se inyectan como variables de entorno
# Solo se versiona secrets.properties.example. No poner valores sensibles aquí.
# Render inyecta PORT; en local, 8080.
server:
  port: ${PORT:8080}

spring:
  application:
    name: odontorisas
  config:
    import: "optional:file:./secrets.properties"

  mvc:
    problemdetails:
      enabled: true          # errores en formato RFC 9457 (ProblemDetail) de forma nativa

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # Pool que deja dormir a una base que se suspende sola (Neon): sin mínimo de conexiones,
    # las ociosas se cierran al minuto y sin keepalive (Hikari lo trae activo cada 2 min).
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:60000}
      keepalive-time: 0
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}

  jpa:
    hibernate:
      ddl-auto: none        # el esquema lo gestiona Flyway
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # Zona de la clínica: "hoy", fechas de impresión y meses del panel (el servidor puede estar en UTC).
  time-zone: ${APP_TIME_ZONE:America/Lima}
  # Identidad visible (OpenAPI). La escribe `pnpm project:apply` desde project.config.json.
  name: "HS FACOP"
  description: "Tu portal al conocimiento y al éxito profesional."
  records:
    # Cupo de historias con el que nace toda cuenta nueva (0–9999). Vacío = sin límite.
    # Las cuentas existentes no cambian; el ADMIN lo ajusta en "Usuarios".
    default-quota: ${RECORDS_DEFAULT_QUOTA:1}
  auth:
    lockout:
      max-attempts: ${AUTH_LOCKOUT_MAX_ATTEMPTS:5}   # fallos consecutivos que bloquean la cuenta
      window: ${AUTH_LOCKOUT_WINDOW:PT15M}           # ISO-8601 Duration del bloqueo
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:mi-proyecto}
      access-ttl: ${JWT_ACCESS_TTL:PT15M}      # ISO-8601 Duration (15 min)
      refresh-ttl: ${JWT_REFRESH_TTL:P7D}      # ISO-8601 Duration (7 días)
    cookie:
      refresh-name: ${REFRESH_COOKIE_NAME:refresh_token}
      secure: ${COOKIE_SECURE:true}            # true en despliegue; false para http local si hace falta
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # always en local; never en despliegue (la ruta es pública).
      show-details: ${HEALTH_SHOW_DETAILS:always}
      # /actuator/health/liveness: el ping del monitor externo (no consulta la BD).
      probes:
        enabled: true

# Documentación de la API (Swagger UI + /v3/api-docs): APAGADA por defecto, así un despliegue
# que no configure nada no la expone. En local: SWAGGER_ENABLED=true en secrets.properties.
# Los tests de contrato la activan por su cuenta (@TestPropertySource).
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
