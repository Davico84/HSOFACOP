# Blueprint de Render: backend del proyecto en el plan gratuito (Docker). Ver docs/deployment.md.
# Las credenciales (sync: false) se cargan en el panel de Render al crear el Blueprint; nunca aquí.
services:
  - type: web
    name: hs-facop-api
    runtime: docker
    plan: free
    region: ohio
    branch: main
    # Despliega solo cuando los checks del CI del commit están en verde.
    autoDeployTrigger: checksPass
    rootDir: modules/backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Liveness no consulta la base (Neon puede dormir). No reemplaza al monitor externo.
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: HEALTH_SHOW_DETAILS
        value: never
      - key: SWAGGER_ENABLED
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      # Neon: cadena directa (sin -pooler) con sslmode=require.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Aleatorio de al menos 32 bytes (openssl rand -base64 48).
      - key: JWT_SECRET
        sync: false
      # Origen exacto del frontend de producción, sin "/" final (p. ej. https://hs-facop.vercel.app).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
